services:
  - type: web
    name: razorpay-backend-c2bt
    env: python
    region: singapore
    plan: free
    rootDir: finance-controller
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=. uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MDR_PERCENTAGE
        value: "2.36"
      - key: MAX_DATE_WINDOW_DAYS
        value: "7"
      - key: SOLARI_STEALTH_MODE
        value: "true"
