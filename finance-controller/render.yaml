services:
  - type: web
    name: razorpay-finance-backend
    env: python
    region: singapore
    plan: free
    healthCheckPath: /health
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python start.py"
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: MDR_PERCENTAGE
        value: "2.36"
      - key: MAX_DATE_WINDOW_DAYS
        value: "7"
      - key: SOLARI_STEALTH_MODE
        value: "true"
